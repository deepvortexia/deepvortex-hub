    <!-- Critical above-the-fold CSS: inlined to eliminate render-blocking stylesheet round-trip on mobile -->
    <style>
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
      :root{--primary-gold:#D4AF37;--light-gold:#E8C87C;--dark-gold:#B8860B;--bg-deep:#0a0a0a;--bg-card:#1a1a1a;--text-bright:#ffffff;--text-dim:#cccccc}

      #root{width:100%;min-height:100vh}
      .hub-portal-container{position:relative;min-height:100vh;padding:3rem 1.5rem;max-width:1400px;margin:0 auto;overflow-x:hidden;box-sizing:border-box}
      .hero-header-section{position:relative;z-index:1;text-align:center;padding:2rem 0 4rem}
      .logo-display-zone{position:relative;width:160px;height:160px;margin:0 auto 2rem}
      .brand-logo-image{width:100%;height:100%;object-fit:contain;position:relative;z-index:3}
      .brand-title-text{font-family:'Orbitron',-apple-system,sans-serif;font-size:3rem;font-weight:900;margin:1rem 0;background:linear-gradient(135deg,var(--light-gold) 0%,var(--primary-gold) 50%,var(--dark-gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
      .primary-tagline{font-family:'Orbitron',-apple-system,sans-serif;font-size:1.3rem;color:var(--light-gold);margin:.5rem 0;font-weight:500}
      .secondary-tagline{font-size:1rem;color:var(--text-dim);margin:.5rem 0 2rem}
      @media(max-width:768px){.hub-portal-container{padding:2rem 1rem}.brand-title-text{font-size:2rem;letter-spacing:2px}.primary-tagline{font-size:1.1rem}.logo-display-zone{width:120px;height:120px}}
      @media(max-width:480px){.brand-title-text{font-size:1.5rem}}
