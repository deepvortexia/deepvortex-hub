<script>
// Star field
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  function init() {
    resize();
    stars = Array.from({length: 200}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      o: Math.random() * 0.8 + 0.2,
      s: Math.random() * 0.003 + 0.001
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() * 0.001;
    stars.forEach(s => {
      const o = s.o * (0.7 + 0.3 * Math.sin(t * s.s * 100));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,175,55,${o * 0.4})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${o})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  init(); draw();
})();
</script>

const categoryClass = {
  "AI Tools": "tag-ai-tools",
  "Tutorials": "tag-tutorials",
  "Updates": "tag-updates",
  "Tips": "tag-tips"
};

function VortexSVG({ size = 240 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 200 200" fill="none">
      {[1,2,3,4,5,6,7].map(i => (
        <circle
          key={i}
          cx="100" cy="100"
          r={10 + i * 12}
          stroke={`rgba(212,175,55,${0.35 - i * 0.04})`}
          strokeWidth={i === 1 ? 1.5 : 0.8}
          strokeDasharray={`${6 - i * 0.5} ${5 + i}`}
          style={{
            transformOrigin: '100px 100px',
            animation: `spin${i % 2 === 0 ? 'Rev' : ''} ${8 + i * 3}s linear infinite`
          }}
        />
      ))}
      <circle cx="100" cy="100" r="6" fill="rgba(212,175,55,0.9)" style={{filter:'blur(2px)'}}/>
      <circle cx="100" cy="100" r="3" fill="#D4AF37"/>
      <style>{`
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinRev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      `}</style>
    </svg>
  );
}

function LogoMark() {
  return (
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      {[1,2,3].map(i => (
        <circle key={i} cx="18" cy="18" r={5 + i * 4}
          stroke={i === 3 ? "rgba(212,175,55,0.25)" : "rgba(212,175,55,0.6)"}
          strokeWidth={i === 1 ? 1.5 : 0.8}
          strokeDasharray="3 3"
          style={{
            transformOrigin: '18px 18px',
            animation: `spin${i % 2 === 0 ? 'Rev' : ''} ${6 + i * 2}s linear infinite`
          }}
        />
      ))}
      <circle cx="18" cy="18" r="3.5" fill="#D4AF37" style={{filter:'blur(0.5px)'}}/>
      <circle cx="18" cy="18" r="2" fill="#ffe870"/>
    </svg>
  );
}

function SearchIcon() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="22" y2="22"/>
    </svg>
  );
}

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = React.useState(false);
  const [activeFilter, setActiveFilter] = React.useState("All");
  const [searchVal, setSearchVal] = React.useState("");
  const [email, setEmail] = React.useState("");
  const [subscribed, setSubscribed] = React.useState(false);
  const [submitting, setSubmitting] = React.useState(false);
  const [hoveredCard, setHoveredCard] = React.useState(null);

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
  }, []);

  const updateTweak = (k, v) => {
    const next = {...tweaks, [k]: v};
    setTweaks(next);
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[k]: v}}, '*');
  };

  const categories = ["All", "AI Tools", "Tutorials", "Updates", "Tips"];
  const filtered = posts.filter(p => {
    const matchCat = activeFilter === "All" || p.category === activeFilter;
    const matchSearch = !searchVal || p.title.toLowerCase().includes(searchVal.toLowerCase()) || p.excerpt.toLowerCase().includes(searchVal.toLowerCase());
    return matchCat && matchSearch;
  });

  const cols = tweaks.layout === "2-col" ? 2 : tweaks.layout === "4-col" ? 4 : 3;

  const handleSubscribe = (e) => {
    e.preventDefault();
    if (!email) return;
    setSubmitting(true);
    setTimeout(() => { setSubscribed(true); setSubmitting(false); }, 1200);
  };

  return (
    <>
      {/* NAV */}
      <nav>
        <a href="#" className="logo">
          <div className="logo-mark"><LogoMark /></div>
          <div className="logo-text">DEEP VORTEX<br/><span>AI</span></div>
        </a>
        <ul className="nav-links">
          <li><a href="#" className="active">Blog</a></li>
          <li><a href="#">Docs</a></li>
          <li><a href="#">Models</a></li>
          <li><a href="#">Pricing</a></li>
        </ul>
        <a href="#" className="nav-cta">Get Access</a>
      </nav>

      {/* HERO */}
      <section className="hero">
        <div className="hero-content">
          <div className="hero-eyebrow">Featured Article</div>
          <h1 className="hero-title">
            The Rise of <span className="highlight">Reasoning Models</span> in Enterprise AI
          </h1>
          <p className="hero-excerpt">
            How chain-of-thought and test-time compute are fundamentally changing what AI can reliably accomplish — and what this means for production deployments in 2026.
          </p>
          <div className="hero-meta">
            <span className={`category-tag tag-ai-tools`}>AI Tools</span>
            <span className="meta-date">Apr 17, 2026</span>
            <span className="meta-date">· 15 min read</span>
          </div>
          <button className="read-more">Read Article</button>
        </div>
        <div className="hero-image">
          <div className="hero-image-placeholder">
            <div className="thumb-grid-pattern"/>
            <div style={{position:'relative', zIndex:1}}>
              <VortexSVG size={320} />
            </div>
          </div>
          <div className="hero-image-overlay"/>
        </div>
      </section>

      {/* SEARCH + BLOG */}
      <section className="blog-section">
        <div className="container">
          {/* Search */}
          <div style={{display:'flex', justifyContent:'center', marginBottom: 64}}>
            <div className="search-bar" style={{maxWidth:540}}>
              <input
                type="text"
                placeholder="Search articles, tutorials, updates…"
                value={searchVal}
                onChange={e => setSearchVal(e.target.value)}
              />
              <button className="search-btn"><SearchIcon /></button>
            </div>
          </div>

          {/* Section header */}
          <div className="section-header">
            <div className="section-title">Latest Articles</div>
            <div className="filter-tabs">
              {categories.map(c => (
                <button
                  key={c}
                  className={`filter-tab ${activeFilter === c ? 'active' : ''}`}
                  onClick={() => setActiveFilter(c)}
                >{c}</button>
              ))}
            </div>
          </div>

          {/* Grid */}
          <div className="blog-grid" style={{gridTemplateColumns: `repeat(${cols}, 1fr)`}}>
            {filtered.map(post => (
              <a
                key={post.id}
                href={post.slug}
                className={`blog-card ${tweaks.cardStyle === 'minimal' ? 'card-minimal' : ''}`}
                onMouseEnter={() => setHoveredCard(post.id)}
                onMouseLeave={() => setHoveredCard(null)}
                style={{textDecoration: 'none', color: 'inherit', display: 'block'}}
              >
                <div className="card-thumb">
                  <div className={`card-thumb-inner ${post.thumb}`}>
                    <div className="thumb-grid-pattern"/>
                    <div className="thumb-label">{post.thumbLabel}</div>
                  </div>
                </div>
                <div className="card-body">
                  <div className="card-meta">
                    <span className={`category-tag ${categoryClass[post.category]}`}>{post.category}</span>
                    <span className="meta-date">{post.date}</span>
                  </div>
                  <h2 className="card-title">{post.title}</h2>
                  <p className="card-excerpt">{post.excerpt}</p>
                  <div className="card-footer">
                    <span className="card-read-time">{post.readTime}</span>
                    <div className="card-arrow">→</div>

            ))}
          </div>

          {filtered.length === 0 && (

              NO ARTICLES FOUND

          )}
        </div>
      </section>

      {/* NEWSLETTER */}
      <section className="newsletter-section">

        <div className="container">
          <div className="newsletter-inner">

            <p className="newsletter-sub">
              Weekly dispatches on AI research, model updates, and practical tutorials. No noise, no spam — only signal.
            </p>
            {subscribed ? (
              <div className="success-msg">
                <span style={{color:'var(--gold)', fontSize:18}}>✦</span>
                TRANSMISSION CONFIRMED — SEE YOU IN YOUR INBOX
              </div>
            ) : (
              <form className="newsletter-form" onSubmit={handleSubscribe}>
                <input
                  type="email"
                  placeholder="Enter your email address"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  required
                />
                <button className="newsletter-submit" type="submit" disabled={submitting}>
                  {submitting ? 'SENDING…' : 'SUBSCRIBE'}
                </button>
              </form>
            )}
            <p className="newsletter-note">No credit card required. Unsubscribe at any time.</p>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer>
        <div className="footer-copy">© 2026 Deep Vortex AI. All rights reserved.</div>
        <div className="footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Contact</a>
          <a href="#">Twitter/X</a>
        </div>
      </footer>

      {/* TWEAKS */}
      {showTweaks && (
        <div className="tweaks-panel">
          <div className="tweaks-title">Tweaks</div>
          <div className="tweak-row">
            <label className="tweak-label">Grid Layout</label>
            <div className="tweak-options">
              {["2-col","3-col","4-col"].map(v => (
                <button key={v} className={`tweak-opt ${tweaks.layout===v?'selected':''}`} onClick={() => updateTweak('layout', v)}>{v}</button>
              ))}
            </div>
          </div>
          <div className="tweak-row">
            <label className="tweak-label">Card Style</label>
            <div className="tweak-options">
              {["bordered","minimal"].map(v => (
                <button key={v} className={`tweak-opt ${tweaks.cardStyle===v?'selected':''}`} onClick={() => updateTweak('cardStyle', v)}>{v}</button>
              ))}
            </div>
          </div>
          <div className="tweak-row">
            <label className="tweak-label">Hero Style</label>
            <div className="tweak-options">
              {["split","centered"].map(v => (
                <button key={v} className={`tweak-opt ${tweaks.heroStyle===v?'selected':''}`} onClick={() => updateTweak('heroStyle', v)}>{v}</button>
              ))}
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
